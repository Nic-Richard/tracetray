name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            analysis/package-lock.json
      - run: npm ci --prefix server
      - run: npm ci --prefix analysis
      - name: JavaScript syntax
        run: git ls-files -z '*.js' | xargs -0 -n 1 node --check
      - run: npm run smoke --prefix server
      - run: npm test --prefix server
      - run: bash -n scripts/deploy-api-remote.sh
      - run: npm ci
      - name: Dashboard types and build
        run: npm run build:web
      - name: Mobile types and connection tests
        run: npm run check:mobile && npm test -w mobile && npm test -w packages/shared
      - name: Android bundle
        run: npm run build:mobile
      - name: Python syntax
        run: python3 -m compileall -q ml
