# Local development only. Production runs on the VPS with pm2 (scripts/deploy.sh).
services:
  mongo:
    image: mongo:7.0.14
    ports:
      - '27018:27017'
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 }).ok']
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    # On a Windows host file changes don't reach the container, so run `docker compose restart server` after server edits.
    command: node server.js
    working_dir: /app/server
    env_file: .env.docker
    environment:
      MONGODB_URI: mongodb://mongo:27017/tracetray
      PORT: '5000'
    ports:
      - '5000:5000'
    depends_on:
      mongo:
        condition: service_healthy
    # Only the code folders are mounted, so the live .env in the repo root never reaches the container.
    volumes:
      - ./server:/app/server
      - ./analysis:/app/analysis
      - ./ml:/app/ml
      - ./client:/app/client
      - /app/server/node_modules
      - /app/analysis/node_modules
      - analysisdata:/app/data

  web:
    image: node:22-bookworm-slim
    working_dir: /repo
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -w web -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY: http://server:5000
      VITE_POLL: '1'
    ports:
      - '5173:5173'
    depends_on:
      - server
    volumes:
      - ./:/repo
      - /repo/node_modules
      - /repo/web/node_modules

volumes:
  mongodata:
  analysisdata:
