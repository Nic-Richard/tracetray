<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Sign in to your TraceTray account.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://tracetray.com/sign-in">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<meta name="theme-color" content="#141724">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>try { const t = localStorage.getItem("tt-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<header class="top-bar">
  <div class="wrap top">
    <a class="logo" href="/"><img src="/logo-mark.svg" alt="">TraceTray</a>
    <nav>
      <a href="/#how">How it works</a>
      <a href="/pricing">Pricing</a>
      <a href="/#faq">FAQ</a>
      <button type="button" class="theme" id="theme" aria-label="Switch theme">
        <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      </button>
      
    </nav>
  </div>
</header>
<main class="center">
  <div id="clerk-mount"></div>
</main>
<footer>
  <div class="wrap">
    <a class="logo" href="/"><img src="/logo-mark.svg" alt="">TraceTray</a>
    <a href="/sign-in">Sign in</a><a href="mailto:support@tracetray.com">Contact</a><a href="/pricing">Pricing</a><a href="/collects">What we collect</a><a href="/privacy">Privacy</a><a href="/terms">Terms</a>
    <span>&copy; 2026 TraceTray</span>
  </div>
</footer>
  <script>
    async function loadScript(src, attributes = {}) {
      await new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = src;
        script.async = true;
        script.crossOrigin = "anonymous";

        Object.entries(attributes).forEach(([name, value]) => {
          script.setAttribute(name, value);
        });

        script.onload = resolve;
        script.onerror = () => reject(new Error(`Failed to load ${src}`));
        document.head.appendChild(script);
      });
    }

    async function initClerk() {
      const params = new URLSearchParams(location.search);
      const destination = params.get("returnTo") === "/app/delete-account" ? "/app/delete-account" : "/app/";
      const signingUp = params.get("mode") === "sign-up";
      const returnTo = destination === "/app/delete-account" ? "returnTo=%2Fapp%2Fdelete-account" : "";
      const response = await fetch("/api/config");

      if (!response.ok) {
        throw new Error("Could not load TraceTray authentication settings.");
      }

      const config = await response.json();
      const publishableKey = config.clerk_publishable_key;

      if (!publishableKey) {
        throw new Error("Clerk publishable key is missing.");
      }

      const clerkDomain = atob(publishableKey.split("_")[2]).slice(0, -1);

      await loadScript(`https://${clerkDomain}/npm/@clerk/ui@1/dist/ui.browser.js`);
      await loadScript(
        `https://${clerkDomain}/npm/@clerk/clerk-js@6/dist/clerk.browser.js`,
        { "data-clerk-publishable-key": publishableKey }
      );

      await window.Clerk.load({
        ui: { ClerkUI: window.__internal_ClerkUICtor }
      });

      if (window.Clerk.isSignedIn) {
        window.location.replace(destination);
        return;
      }

      const mount = signingUp ? "mountSignUp" : "mountSignIn";
      document.title = `${signingUp ? "Sign Up" : "Sign In"} | TraceTray`;
      window.Clerk[mount](document.getElementById("clerk-mount"), {
        routing: "hash",
        signInUrl: `/sign-in${returnTo ? `?${returnTo}` : ""}`,
        signUpUrl: `/sign-in?mode=sign-up${returnTo ? `&${returnTo}` : ""}`,
        forceRedirectUrl: destination,
        signInForceRedirectUrl: destination,
        signUpForceRedirectUrl: destination
      });
    }

    initClerk().catch(error => {
      console.error("Clerk initialization failed:", error);
      document.getElementById("clerk-mount").innerHTML =
        '<p style="padding:24px;">Sign-in could not be loaded. Please refresh and try again.</p>';
    });
  </script>
<script src="/assets/site.js?v=1"></script>
</body>
</html>
