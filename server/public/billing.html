<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Manage your TraceTray billing details.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://tracetray.com/billing.html">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#141724">
<title>Billing | TraceTray</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css?v=4">
<script>try { const t = localStorage.getItem("tt-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<header class="top-bar">
  <div class="wrap top">
    <a class="logo" href="/"><img src="/logo-mark.svg" alt="">TraceTray</a>
    <nav>
      <a href="/#how">How it works</a>
      <a href="/pricing.html">Pricing</a>
      <a href="/#faq">FAQ</a>
      <button type="button" class="theme" id="theme" aria-label="Switch theme">
        <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      </button>
      
    </nav>
  </div>
</header>
<main class="center">
  <div class="spinner"></div>
  <p>Opening the billing portal…</p>
</main>
<footer>
  <div class="wrap">
    <a class="logo" href="/"><img src="/logo-mark.svg" alt="">TraceTray</a>
    <a href="/sign-in.html">Sign in</a><a href="mailto:support@tracetray.com">Contact</a><a href="/pricing.html">Pricing</a><a href="/collects.html">What we collect</a><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a>
    <span>&copy; 2026 TraceTray</span>
  </div>
</footer>
  <script>
    async function init() {
      const config      = await fetch("/api/config").then(r => r.json());
      const pubKey      = config.clerk_publishable_key;
      const clerkDomain = atob(pubKey.split("_")[2]).slice(0, -1);

      await new Promise((resolve, reject) => {
        const ui       = document.createElement("script");
        ui.src         = `https://${clerkDomain}/npm/@clerk/ui@1/dist/ui.browser.js`;
        ui.async       = true;
        ui.crossOrigin = "anonymous";
        ui.onload      = resolve;
        ui.onerror     = reject;
        document.head.appendChild(ui);
      });

      await new Promise((resolve, reject) => {
        const s        = document.createElement("script");
        s.src          = `https://${clerkDomain}/npm/@clerk/clerk-js@6/dist/clerk.browser.js`;
        s.setAttribute("data-clerk-publishable-key", pubKey);
        s.async        = true;
        s.crossOrigin  = "anonymous";
        s.onload       = resolve;
        s.onerror      = reject;
        document.head.appendChild(s);
      });

      await window.Clerk.load({ ui: { ClerkUI: window.__internal_ClerkUICtor } });

      if (!window.Clerk.user) {
        window.location.href = "/sign-in.html";
        return;
      }

      const token = await window.Clerk.session.getToken();
      const res   = await fetch("/api/billing-portal", {
        method:  "POST",
        headers: { "Authorization": `Bearer ${token}` }
      });

      const data = await res.json();

      if (!res.ok) {
        document.querySelector("p").textContent = data.error || "Could not open billing portal.";
        document.querySelector(".spinner").style.display = "none";
        return;
      }

      window.location.href = data.url;
    }

    init().catch(err => {
      document.querySelector("p").textContent = "Something went wrong. Please try again.";
      document.querySelector(".spinner").style.display = "none";
      console.error(err);
    });
  </script>
<script src="/assets/site.js?v=1"></script>
</body>
</html>
