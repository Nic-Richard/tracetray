<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Manage your TraceTray billing details.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://tracetray.com/billing.html">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#5b5bd6">
<title>Billing | TraceTray</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink:     #0d0d0f;
  --muted:   #6b6b78;
  --surface: #f6f6f8;
  --indigo:  #5b5bd6;
  --white:   #ffffff;
  --font:    'Inter', system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--surface);
  color: var(--ink);
  font-family: var(--font);
  font-weight: 300;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 40px 20px;
}
.logo { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); }
.logo span { color: var(--indigo); }
p { font-size: 14px; color: var(--muted); }
.spinner {
  width: 20px; height: 20px;
  border: 2px solid #e2e2e8;
  border-top-color: var(--indigo);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.dark { --ink: #e8e8f0; --ink-2: #b8b8c8; --muted: #6b6b80; --muted-2: #9898b0; --surface: #161619; --border: rgba(255,255,255,0.08); --indigo: #7b7be6; --indigo-bg: rgba(91,91,214,0.12); --white: #0f0f13; }
</style>

<script>
(function() {
  if (localStorage.getItem("tt-dark") === "1") document.documentElement.classList.add("dark");
})();
</script>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png">
</head>
<body>
  <div class="logo">Trace<span>Tray</span></div>
  <div class="spinner"></div>
  <p>Opening billing portal...</p>

  <script>
    async function init() {
      const config      = await fetch("/api/config").then(r => r.json());
      const pubKey      = config.clerk_publishable_key;
      const clerkDomain = atob(pubKey.split("_")[2]).slice(0, -1);

      await new Promise((resolve, reject) => {
        const ui       = document.createElement("script");
        ui.src         = `https://${clerkDomain}/npm/@clerk/ui@1/dist/ui.browser.js`;
        ui.async       = true;
        ui.crossOrigin = "anonymous";
        ui.onload      = resolve;
        ui.onerror     = reject;
        document.head.appendChild(ui);
      });

      await new Promise((resolve, reject) => {
        const s        = document.createElement("script");
        s.src          = `https://${clerkDomain}/npm/@clerk/clerk-js@6/dist/clerk.browser.js`;
        s.setAttribute("data-clerk-publishable-key", pubKey);
        s.async        = true;
        s.crossOrigin  = "anonymous";
        s.onload       = resolve;
        s.onerror      = reject;
        document.head.appendChild(s);
      });

      await window.Clerk.load({ ui: { ClerkUI: window.__internal_ClerkUICtor } });

      if (!window.Clerk.user) {
        window.location.href = "/sign-in.html";
        return;
      }

      const token = await window.Clerk.session.getToken();
      const res   = await fetch("/api/billing-portal", {
        method:  "POST",
        headers: { "Authorization": `Bearer ${token}` }
      });

      const data = await res.json();

      if (!res.ok) {
        document.querySelector("p").textContent = data.error || "Could not open billing portal.";
        document.querySelector(".spinner").style.display = "none";
        return;
      }

      window.location.href = data.url;
    }

    init().catch(err => {
      document.querySelector("p").textContent = "Something went wrong. Please try again.";
      document.querySelector(".spinner").style.display = "none";
      console.error(err);
    });
  </script>
</body>
</html>
